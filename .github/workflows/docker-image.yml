name: Docker Image

on:
  push:
    branches: [ "develop", "master" ]
  pull_request:
    branches: [ "develop", "master" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: oficina-api

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image tag
        id: image
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "tag=${{ env.REGISTRY }}/${OWNER}/${{ env.IMAGE_NAME }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          CHANNEL=develop
          if [ "$GITHUB_REF" = "refs/heads/master" ]; then
            CHANNEL=latest
          fi
          echo "channel=${{ env.REGISTRY }}/${OWNER}/${{ env.IMAGE_NAME }}:${CHANNEL}" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build \
            -t ${{ steps.image.outputs.tag }} \
            -t ${{ steps.image.outputs.channel }} \
            .

      - name: Push image
        if: github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
        run: |
          docker push ${{ steps.image.outputs.tag }}
          docker push ${{ steps.image.outputs.channel }}
