services:
  api:
    image: oficina-api:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oficina-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=oficina;Username=postgres;Password=postgres
      Jwt__Key: trocar-esta-chave-em-producao-com-no-minimo-32-caracteres
      Jwt__Issuer: OficinaMecanica
      Jwt__Audience: OficinaMecanica.Admin
      Jwt__AdminUser: admin
      Jwt__AdminPassword: Admin@123
      ExternalIntegrations__BudgetToken: token-dev-orcamento
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    container_name: oficina-postgres
    environment:
      POSTGRES_DB: oficina
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - oficina_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oficina"]
      interval: 5s
      timeout: 5s
      retries: 10
  os-db:
    image: postgres:16-alpine
    container_name: oficina-os-postgres
    environment:
      POSTGRES_DB: oficina_os
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - oficina_os_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oficina_os"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 20
  billing-db:
    image: mongo:7
    container_name: oficina-billing-mongo
    ports:
      - "27017:27017"
    volumes:
      - oficina_billing_mongodata:/data/db
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: oficina-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: oficina
      RABBITMQ_DEFAULT_PASS: oficina
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - oficina_rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 12
  os-service:
    build: ./services/os-service
    container_name: oficina-os-service
    restart: on-failure
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__OsDatabase: Host=os-db;Port=5432;Database=oficina_os;Username=postgres;Password=postgres
      RabbitMq__Host: rabbitmq
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - "8081:8080"
    depends_on:
      os-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
  billing-service:
    build: ./services/billing-service
    container_name: oficina-billing-service
    restart: on-failure
    environment:
      ASPNETCORE_URLS: http://+:8080
      Mongo__ConnectionString: mongodb://billing-db:27017
      RabbitMq__Host: rabbitmq
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      MercadoPago__AccessToken: ${MERCADO_PAGO_ACCESS_TOKEN:-}
      MercadoPago__WebhookUrl: ${MERCADO_PAGO_WEBHOOK_URL:-}
      MercadoPago__WebhookSecret: ${MERCADO_PAGO_WEBHOOK_SECRET:-}
      MercadoPago__ExternalPosId: ${MERCADO_PAGO_EXTERNAL_POS_ID:-}
    ports:
      - "8082:8080"
    depends_on:
      billing-db:
        condition: service_started
      rabbitmq:
        condition: service_healthy
  execution-service:
    build: ./services/execution-service
    container_name: oficina-execution-service
    restart: on-failure
    environment:
      ASPNETCORE_URLS: http://+:8080
      Mongo__ConnectionString: mongodb://billing-db:27017
      Mongo__Database: oficina_execution
      RabbitMq__Host: rabbitmq
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - "8083:8080"
    depends_on:
      billing-db:
        condition: service_started
      rabbitmq:
        condition: service_healthy
volumes:
  oficina_pgdata:
  oficina_os_pgdata:
  oficina_billing_mongodata:
  oficina_rabbitmqdata:
