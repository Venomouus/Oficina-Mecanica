apiVersion: 1
groups:
  - orgId: 1
    name: oficina-local
    folder: Oficina
    interval: 10s
    rules:
      - uid: oficina-os-falha
        title: Falha no processamento de OS
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: A API respondeu 5xx em uma rota de ordens de servico nos ultimos 5 minutos.
          description: Consultar o painel e correlacionar o trace_id nos logs. Erros 4xx de validacao nao disparam este alerta.
        labels:
          severity: warning
        data:
          - refId: A
            datasourceUid: oficina-prom
            relativeTimeRange: {from: 600, to: 0}
            model:
              refId: A
              expr: sum(increase(oficina_os_failures_total[5m])) or vector(0)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
                  operator: {type: and}
                  reducer: {type: last}
                  type: query
      - uid: oficina-coleta-indisponivel
        title: API sem coleta de negocio recente
        condition: C
        for: 20s
        noDataState: Alerting
        execErrState: Error
        annotations:
          summary: Banco ou API indisponivel, ou sem telemetria recente.
        labels:
          severity: warning
        data:
          - refId: A
            datasourceUid: oficina-prom
            relativeTimeRange: {from: 600, to: 0}
            model:
              refId: A
              expr: (max(oficina_business_collection_ok) == bool 0) + (time() - max(oficina_business_last_success_unixtime) > bool 30)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
                  operator: {type: and}
                  reducer: {type: last}
                  type: query
