# Laboratorio temporario: emptyDir perde dados quando o pod e recriado.
# Nunca aplicar esta configuracao em producao.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: os-db
  namespace: oficina
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: os-db }
  template:
    metadata:
      labels: { app: os-db }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: oficina_os
            - name: POSTGRES_USER
              value: oficina
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: os-db-credentials, key: password }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "oficina", "-d", "oficina_os"]
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 128Mi, ephemeral-storage: 128Mi }
            limits: { memory: 512Mi, ephemeral-storage: 1Gi }
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: os-db
  namespace: oficina
spec:
  selector: { app: os-db }
  ports:
    - { port: 5432, targetPort: 5432 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-db
  namespace: oficina
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: billing-db }
  template:
    metadata:
      labels: { app: billing-db }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: mongo
          image: mongo:7
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: oficina
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: billing-db-credentials, key: password }
          volumeMounts:
            - { name: data, mountPath: /data/db }
          readinessProbe:
            tcpSocket: { port: 27017 }
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi, ephemeral-storage: 128Mi }
            limits: { memory: 768Mi, ephemeral-storage: 1Gi }
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: billing-db
  namespace: oficina
spec:
  selector: { app: billing-db }
  ports:
    - { port: 27017, targetPort: 27017 }
---
