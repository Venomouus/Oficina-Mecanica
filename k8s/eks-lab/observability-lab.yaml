# Coletor e painel temporarios; somente ClusterIP, sem LoadBalancer publico.
apiVersion: v1
kind: ConfigMap
metadata:
  name: observability-config
  namespace: oficina
data:
  otlp-endpoint: http://otel-lgtm:4317
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-lgtm
  namespace: oficina
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: otel-lgtm }
  template:
    metadata:
      labels: { app: otel-lgtm }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: otel-lgtm
          image: grafana/otel-lgtm:0.33.0
          ports:
            - { containerPort: 3000, name: grafana }
            - { containerPort: 4317, name: otlp }
            - { containerPort: 9090, name: prometheus }
          env:
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: grafana-credentials, key: admin-password }
          volumeMounts:
            - { name: data, mountPath: /data }
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12
          resources:
            requests: { cpu: 200m, memory: 512Mi, ephemeral-storage: 128Mi }
            limits: { memory: 2Gi, ephemeral-storage: 1Gi }
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: otel-lgtm
  namespace: oficina
spec:
  selector: { app: otel-lgtm }
  ports:
    - { name: grafana, port: 3000, targetPort: 3000 }
    - { name: otlp, port: 4317, targetPort: 4317 }
    - { name: prometheus, port: 9090, targetPort: 9090 }
